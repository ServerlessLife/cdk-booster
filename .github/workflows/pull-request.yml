name: Pull Request CI check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/common-build.yml
    secrets: inherit

  test:
    uses: ./.github/workflows/common-test.yml
    secrets: inherit
    needs: build
    with:
      mode: build

  test_aws_cdk_lib_2_239_0:
    uses: ./.github/workflows/common-test.yml
    secrets: inherit
    needs: test
    with:
      mode: build
      awsCdk: '2.1106.1'
      awsCdkLib: '2.239.0'
      constructs: '^10.5.1'

  test_aws_cdk_lib_2_251_0:
    uses: ./.github/workflows/common-test.yml
    secrets: inherit
    needs: test_aws_cdk_lib_2_239_0
    with:
      mode: build
      awsCdk: '2.1119.0'
      awsCdkLib: '2.251.0'
      constructs: '^10.6.0'

  test_aws_cdk_lib_2_261_0:
    uses: ./.github/workflows/common-test.yml
    secrets: inherit
    needs: test_aws_cdk_lib_2_251_0
    with:
      mode: build
      awsCdk: '2.1130.0'
      awsCdkLib: '2.261.0'
      constructs: '^10.6.0'
