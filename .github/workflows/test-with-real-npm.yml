name: Test with real npm

run-name: 'Test with real npm'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specify the version of the package'
        type: string
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  test_global:
    uses: ./.github/workflows/common-test.yml
    with:
      mode: global
      version: ${{ inputs.version }}
    secrets: inherit

  test_global_aws_cdk_lib_2_239_0:
    uses: ./.github/workflows/common-test.yml
    needs: test_global
    with:
      mode: global
      version: ${{ inputs.version }}
      awsCdk: '2.1106.1'
      awsCdkLib: '2.239.0'
      constructs: '^10.5.1'
    secrets: inherit

  test_local:
    uses: ./.github/workflows/common-test.yml
    with:
      mode: local
      version: ${{ inputs.version }}
    secrets: inherit

  test_local_aws_cdk_lib_2_239_0:
    uses: ./.github/workflows/common-test.yml
    needs: test_local
    with:
      mode: local
      version: ${{ inputs.version }}
      awsCdk: '2.1106.1'
      awsCdkLib: '2.239.0'
      constructs: '^10.5.1'
    secrets: inherit
