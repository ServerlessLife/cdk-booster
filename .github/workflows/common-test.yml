name: Common CI tests

run-name: 'Test: mode=${{ inputs.mode }}'

on:
  workflow_call:
    inputs:
      mode:
        description: "'build' (just builded code, used while publishing) or 'global' (real NPM installed globally) or 'local' (real NPM installed locally)"
        type: string
        required: true
      version:
        description: 'Specify the version of the package'
        type: string
        required: false
      awsCdk:
        description: 'Override aws-cdk in test/cdk-basic (devDependencies). Leave empty to use package.json.'
        type: string
        required: false
        default: ''
      awsCdkLib:
        description: 'Override aws-cdk-lib in test/cdk-basic (dependencies). Leave empty to use package.json.'
        type: string
        required: false
        default: ''
      constructs:
        description: 'Override constructs in test/cdk-basic (dependencies). Leave empty to use package.json.'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  REAL_NPM: ${{ inputs.mode == 'global' || inputs.mode == 'local' }}
  node_version: 22

jobs:
  test-cdk-basic:
    runs-on: ubuntu-latest
    concurrency:
      group: test-cdk-basic
    steps:
      - uses: actions/checkout@v6
      - name: Apply optional CDK package versions (test/cdk-basic)
        if: ${{ inputs.awsCdk != '' || inputs.awsCdkLib != '' || inputs.constructs != '' }}
        env:
          AWS_CDK: ${{ inputs.awsCdk }}
          AWS_CDK_LIB: ${{ inputs.awsCdkLib }}
          CONSTRUCTS: ${{ inputs.constructs }}
        run: |
          set -euo pipefail
          PKG=test/cdk-basic/package.json
          tmp="$(mktemp)"
          jq --indent 2 \
            --arg ac "${AWS_CDK:-}" \
            --arg acl "${AWS_CDK_LIB:-}" \
            --arg c "${CONSTRUCTS:-}" \
            '
            .devDependencies |= (. // {})
            | .dependencies |= (. // {})
            | .devDependencies["aws-cdk"] = (if ($ac | length) > 0 then $ac else .devDependencies["aws-cdk"] end)
            | .dependencies["aws-cdk-lib"] = (if ($acl | length) > 0 then $acl else .dependencies["aws-cdk-lib"] end)
            | .dependencies["constructs"] = (if ($c | length) > 0 then $c else .dependencies["constructs"] end)
            ' "$PKG" > "$tmp"
          mv "$tmp" "$PKG"
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}
      - name: Install dependencies
        run: npm i
      - name: Download build artifact
        uses: actions/download-artifact@v6
        if: ${{ inputs.mode == 'build' }}
        with:
          name: dist
          path: dist
      - name: Install cdk-booster globally
        if: ${{ inputs.mode == 'global' }}
        run: |
          npm i cdk-booster@${{ inputs.version || 'latest' }} -g
        working-directory: test
      - name: Install cdk-booster locally
        if: ${{ inputs.mode == 'local' }}
        run: |
          npm i cdk-booster@${{ inputs.version || 'latest' }}
        working-directory: test
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions
      # - name: Destroy
      #   run: npm run destroy
      #   working-directory: test/cdk-basic
      #   continue-on-error: true
      - name: Prepare bucket test (before original deploy)
        run: |
          npx tsx ../../scripts/prepare-bucket-test.ts cdk-outputs.json assets
        working-directory: test/cdk-basic
      - name: Deploy CDK original
        run: |
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "npx ts-node --prefer-ts-exts bin/cdk-basic.ts"
          set -o pipefail
          npm run deploy 2>&1 | tee cdk-original.log
        working-directory: test/cdk-basic
      - name: Check there was bundling
        run: |
          ../../scripts/check-bundling.sh cdk-original.log true
        working-directory: test/cdk-basic
      - name: Save CDK original state
        run: |
          npx tsx ../../scripts/export-state.ts cdk-outputs.json cdk-original-function-files.json
        working-directory: test/cdk-basic
      - name: Test cdk ls command (build mode)
        if: ${{ inputs.mode == 'build' }}
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "node ../../dist/cdk-booster.mjs bin/cdk-basic.ts"
          npx cdk ls 2>&1 | tee cdk-ls.log
          # Fail if any error is found in the output
          grep -qi "error" cdk-ls.log && echo "Error found in cdk ls output" && exit 1
          # Verify expected stacks are listed
          grep -q "CdkbasicStack" cdk-ls.log || (echo "Expected stacks not found" && exit 1)
        working-directory: test/cdk-basic
      - name: Test cdk ls command (global or local mode)
        if: ${{ inputs.mode == 'global' || inputs.mode == 'local' }}
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "npx cdk-booster bin/cdk-basic.ts"
          npx cdk ls 2>&1 | tee cdk-ls.log
          # Fail if any error is found in the output
          grep -qi "error" cdk-ls.log && echo "Error found in cdk ls output" && exit 1
          # Verify expected stacks are listed
          grep -q "CdkbasicStack" cdk-ls.log || (echo "Expected stacks not found" && exit 1)
        working-directory: test/cdk-basic
      - name: Prepare bucket test (before booster deploy)
        run: |
          npx tsx ../../scripts/prepare-bucket-test.ts cdk-outputs.json assets
        working-directory: test/cdk-basic
      - name: Deploy via cdk-booster (build mode)
        if: ${{ inputs.mode == 'build' }}
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "node ../../dist/cdk-booster.mjs bin/cdk-basic.ts -v"
          set -o pipefail
          npm run deploy 2>&1 | tee cdk-booster.log
        working-directory: test/cdk-basic
      - name: Deploy via cdk-booster (global or local mode)
        if: ${{ inputs.mode == 'global' || inputs.mode == 'local' }}
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "npx cdk-booster bin/cdk-basic.ts -v"
          set -o pipefail
          npm run deploy 2>&1 | tee cdk-booster.log
        working-directory: test/cdk-basic
      - name: Check there was not double prebundling
        run: |
          cat cdk-booster.log
          npx tsx ../../scripts/check-double-prebundle.ts cdk-booster.log
        working-directory: test/cdk-basic
      - name: Check there was no bundling
        run: |
          ../../scripts/check-bundling.sh cdk-booster.log false
        working-directory: test/cdk-basic
      - name: Save cdk-booster state
        run: |
          npx tsx ../../scripts/export-state.ts cdk-outputs.json cdk-booster-function-files.json
        working-directory: test/cdk-basic
      - name: Compare CDK original and cdk-booster states
        run: |
          npx tsx ../../scripts/compare-states.ts cdk-original-function-files.json cdk-booster-function-files.json
        working-directory: test/cdk-basic

      - name: Another deploy via cdk-booster, because it could fail if repeated
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npm run deploy
        working-directory: test/cdk-basic

      - name: Prepare bucket test (before booster deploy - batch=1 parallel=1)
        run: |
          npx tsx ../../scripts/prepare-bucket-test.ts cdk-outputs.json assets
        working-directory: test/cdk-basic
      - name: Deploy via cdk-booster (build mode) - batch=1 parallel=1
        if: ${{ inputs.mode == 'build' }}
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "node ../../dist/cdk-booster.mjs bin/cdk-basic.ts -v -b 1 -p 1"
          set -o pipefail
          npm run deploy 2>&1 | tee cdk-booster.log
        working-directory: test/cdk-basic
      - name: Deploy via cdk-booster (global or local mode) - batch=1 parallel=1
        if: ${{ inputs.mode == 'global' || inputs.mode == 'local' }}
        run: |
          rm -rf cdk.out
          rm -f cdk.context.json
          npx tsx ../../scripts/modify-cdk-json.ts ../../test/cdk-basic/cdk.json "npx cdk-booster bin/cdk-basic.ts -v -b 1 -p 1"
          set -o pipefail
          npm run deploy 2>&1 | tee cdk-booster.log
        working-directory: test/cdk-basic
      - name: Check there was not double prebundling - batch=1 parallel=1
        run: |
          cat cdk-booster.log
          npx tsx ../../scripts/check-double-prebundle.ts cdk-booster.log
        working-directory: test/cdk-basic
      - name: Check there was no bundling - batch=1 parallel=1
        run: |
          ../../scripts/check-bundling.sh cdk-booster.log false
        working-directory: test/cdk-basic
      - name: Save cdk-booster state - batch=1 parallel=1
        run: |
          npx tsx ../../scripts/export-state.ts cdk-outputs.json cdk-booster-function-files.json
        working-directory: test/cdk-basic
      - name: Compare CDK original and cdk-booster states - batch=1 parallel=1
        run: |
          npx tsx ../../scripts/compare-states.ts cdk-original-function-files.json cdk-booster-function-files.json
        working-directory: test/cdk-basic
