name: Common CI build

on:
  workflow_call:

permissions:
  id-token: write
  contents: write

env:
  node_version: 22

jobs:
  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: 'npm'
      - name: Install NPM dependencies
        run: npm ci
      - name: Typecheck
        run: |
          npm run typecheck
      - name: Lint
        run: |
          npx eslint .
      - name: Prettier
        run: |
          npx prettier --check .

  build:
    needs:
      - lint
    runs-on: ubuntu-latest
    concurrency:
      group: build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
